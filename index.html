<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Rail Employee Survey</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; }
        h2 { text-align: center; }
        .question { margin-bottom: 15px; }
        .btn { display: block; width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>Network Rail Employee Survey</h2>
    
    <form id="surveyForm">
        <label for="companyID">Company Name ID:</label>
        <select id="companyID" name="companyID">
            <option value="NR01">NR01</option>
            <option value="NR02">NR02</option>
            <option value="NR03">NR03</option>
        </select>

        <label>Time Period of Employment:</label>
        <label><input type="radio" name="timePeriod" value="0"> Less than 6 months</label>
        <label><input type="radio" name="timePeriod" value="1"> 6 months to 2 years</label>
        <label><input type="radio" name="timePeriod" value="2"> More than 2 years</label>

        <div class="question">
            <p>I feel valued as an employee.</p>
            <label><input type="radio" name="q1" value="0"> 0</label>
            <label><input type="radio" name="q1" value="1"> 1</label>
            <label><input type="radio" name="q1" value="2"> 2</label>
        </div>

        <div class="question">
            <p>Communication within my team is effective.</p>
            <label><input type="radio" name="q2" value="0"> 0</label>
            <label><input type="radio" name="q2" value="1"> 1</label>
            <label><input type="radio" name="q2" value="2"> 2</label>
        </div>

        <!-- Repeat the same pattern for remaining 18 questions -->

        <button type="submit" class="btn">Submit</button>
    </form>

    <script>
        document.getElementById("surveyForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            let formData = new FormData(this);
            let surveyData = {};
            formData.forEach((value, key) => {
                surveyData[key] = value;
            });

            fetch('https://script.google.com/macros/s/AKfycbzL9BnghzIEgZvMSRcxENBZj7am483gF70LVVfTk4RdJeupGSWCeijH20sE_2EgsJJd/exec', {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(surveyData)
            }).then(() => alert("Survey submitted successfully!"));
        });
    </script>
</body>
</html>
